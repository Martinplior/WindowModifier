[package]
name = "window_modifier"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["vulkan", "gles"] }
eframe = { version = "0.33.3", default-features = false, features = ["wgpu"] }
egui = { version = "0.33.3", default-features = false }
rfd = { version = "0.17.2", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_ProcessStatus",
] }
